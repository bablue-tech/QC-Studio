<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/g5-mark.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrameProof QC Studio — AI-Powered Visual Quality Control</title>
    <meta name="description" content="Professional AI-powered visual quality control and brand compliance checker. Analyze images with neural precision." />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Inter:opsz,wght@14..32,300..800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Dark gold G5 theme by default; the header toggle switches to the light G5 theme and remembers it.
      try {
        var light = localStorage.getItem('theme') === 'light'
        document.documentElement.classList.toggle('dark', !light)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f8f7f5' : '#0a0a0b')
      } catch (e) { document.documentElement.classList.add('dark') }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
